name: StoreFlow Customer CI

on:
  push:
    branches: [main11, ux-redesign-safe, 'agent/**']
  pull_request:
    branches: [main11]

permissions:
  contents: write

concurrency:
  group: customer-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply service toggle sync patch
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          old='''  const template = storeData?.data?.businessTemplate;\nif (prods.length === 0 && Array.isArray(template?.offerings) && template.offerings.length > 0) {\n  prods = template.offerings.map((o: any, index: number) => ({ id: String(o.id || `service-${index}`), store_id: storeUuid, name: o.name || 'Service', description: o.description || '', selling_price: Number(o.price ?? o.sellingPrice ?? 0), wholesale_price: Number(o.price ?? o.sellingPrice ?? 0), retail_price: Number(o.price ?? o.sellingPrice ?? 0), quantity: 999999, unit: o.pricing === 'time' ? 'session' : 'service', isService: true, turnaround: o.turnaround || '', category: 'Services', image: o.image || '', status: 'active' }));\n}\nif (prods.length === 0) {\n'''
          new='''  const template = storeData?.data?.businessTemplate;\n  const serviceTypes = new Set(['laundry','barber','salon','tailoring','repair','printing','cyber_cafe','car_wash','photography','cleaning','spa','games','gaming','restaurant']);\n  const templateType = String(template?.type || storeData?.data?.storeType || storeData?.storeType || '').toLowerCase();\n  const serviceBusiness = serviceTypes.has(templateType) || (Array.isArray(template?.modes) && template.modes.includes('services'));\n\n  if (prods.length === 0) {\n'''
          if old in s:
              s=s.replace(old,new,1)
          needle='''    prods = (prodData || []).map((p: any) => ({\n      ...p,\n      isService: Boolean(p.isService ?? p.is_service),\n      wholesale_price: p.wholesale_price ?? p.selling_price ?? 0,\n      retail_price: p.retail_price ?? p.selling_price ?? 0\n    }));\n  }\n\n  return prods;\n}'''
          repl='''    prods = (prodData || []).map((p: any) => ({\n      ...p,\n      isService: Boolean(p.isService ?? p.is_service),\n      wholesale_price: p.wholesale_price ?? p.selling_price ?? 0,\n      retail_price: p.retail_price ?? p.selling_price ?? 0\n    }));\n  }\n\n  // businessTemplate.offerings is the merchant's source of truth for services.\n  if (serviceBusiness && Array.isArray(template?.offerings) && !s.includes('businessTemplate.offerings is the merchant')) {\n    const existingIds = new Set(prods.map((p: any) => String(p.id)));\n    const existingNames = new Set(prods.map((p: any) => String(p.name || '').trim().toLowerCase()));\n    const enabledServices = template.offerings\n      .filter((o: any) => o && o.discontinued !== true && o.enabled !== false && o.active !== false && o.status !== 'inactive')\n      .map((o: any, index: number) => ({ id: String(o.id || `service-${index}`), store_id: storeUuid, name: o.name || 'Service', description: o.description || '', selling_price: Number(o.price ?? o.sellingPrice ?? 0), wholesale_price: Number(o.price ?? o.sellingPrice ?? 0), retail_price: Number(o.price ?? o.sellingPrice ?? 0), quantity: 999999, unit: o.pricing === 'time' ? 'session' : 'service', isService: true, turnaround: o.turnaround || '', category: 'Services', image: o.image || '', status: 'active' }))\n      .filter((o: any) => !existingIds.has(String(o.id)) && !existingNames.has(String(o.name).trim().toLowerCase()));\n    prods = [...prods, ...enabledServices];\n  }\n\n  return prods;\n}'''
          if needle in s and 'businessTemplate.offerings is the merchant' not in s:
              s=s.replace(needle,repl,1)
          p.write_text(s)
      - name: Commit service storefront patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          if ! git diff --cached --quiet; then
            git commit -m "feat: sync enabled merchant services to customer storefront"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Check whitespace errors
        run: git diff --check

      - name: Lint
        run: npm run lint

      - name: TypeScript + production build
        run: npm run build
