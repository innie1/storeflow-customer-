name: StoreFlow Customer CI

on:
  push:
    branches: [main11, ux-redesign-safe, 'agent/**']
  pull_request:
    branches: [main11]

permissions:
  contents: read

concurrency:
  group: customer-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 24 (LTS) runs the .ts import in scripts/test-order-pricing.mjs
          # via Node's built-in type stripping.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check whitespace errors
        run: git diff --check

      - name: Store-specific service regressions
        run: npm test

      - name: Lint
        run: npm run lint

      - name: TypeScript + production build
        run: npm run build
