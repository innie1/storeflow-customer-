<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .map-mesh {
            background-image: radial-gradient(#d1d1d1 1px, transparent 1px);
            background-size: 20px 20px;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.33); opacity: 1; }
            80%, 100% { opacity: 0; }
        }
        .pulse-effect::before {
            content: '';
            position: absolute;
            width: 300%;
            height: 300%;
            border-radius: 9999px;
            background-color: #ffe170;
            animation: pulse-ring 2s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface font-body-md text-on-surface antialiased">
<!-- Top Navigation Bar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-gutter h-14 bg-surface dark:bg-background">
<button class="flex items-center justify-center w-10 h-10 hover:bg-surface-container-low transition-transform active:scale-95 duration-150 rounded-full">
<span class="material-symbols-outlined text-secondary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile text-on-background font-bold">Track Order</h1>
<button class="flex items-center justify-center w-10 h-10 hover:bg-surface-container-low transition-transform active:scale-95 duration-150 rounded-full">
<span class="material-symbols-outlined text-secondary">support_agent</span>
</button>
</header>
<main class="pt-14 pb-24 min-h-screen flex flex-col">
<!-- Live Map Context Area -->
<div class="relative flex-grow min-h-[400px] overflow-hidden bg-surface-container-low map-mesh">
<!-- Simulated Map Elements -->
<div class="absolute inset-0 opacity-20 pointer-events-none">
<div class="absolute top-1/4 left-1/4 w-1/2 h-1 bg-on-surface-variant/20 rotate-12"></div>
<div class="absolute top-1/2 left-0 w-full h-1 bg-on-surface-variant/20 -rotate-6"></div>
<div class="absolute top-0 right-1/3 w-1 h-full bg-on-surface-variant/20"></div>
</div>
<!-- Route Path (Animated SVG would normally go here, but using styled DIV for path) -->
<div class="absolute top-[45%] left-[20%] w-[60%] h-[2px] bg-primary/30 origin-left scale-x-100"></div>
<!-- Delivery Destination -->
<div class="absolute top-[40%] right-[15%] flex flex-col items-center">
<div class="w-8 h-8 bg-on-background text-white rounded-full flex items-center justify-center shadow-lg border-4 border-white">
<span class="material-symbols-outlined text-sm">home</span>
</div>
<div class="mt-2 bg-white px-2 py-1 rounded shadow-sm text-[10px] font-bold">Home</div>
</div>
<!-- Animated Rider Marker -->
<div class="absolute top-[44%] left-[35%] transition-all duration-1000 ease-in-out" id="rider-marker">
<div class="relative flex flex-col items-center">
<div class="pulse-effect absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>
<div class="relative w-12 h-12 bg-primary-container rounded-full flex items-center justify-center shadow-xl border-2 border-white z-10">
<span class="material-symbols-outlined text-primary text-2xl">delivery_dining</span>
</div>
</div>
</div>
<!-- Order Status Floating Card -->
<div class="absolute top-6 left-6 right-6">
<div class="bg-surface/95 backdrop-blur-md p-5 rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.05)] border border-white/50">
<div class="flex justify-between items-start">
<div>
<p class="text-secondary font-label-lg text-label-lg uppercase tracking-wider mb-1">Estimated arrival</p>
<h2 class="font-headline-xl-mobile text-headline-xl-mobile text-on-background">20-30 <span class="text-headline-md">min</span></h2>
<p class="text-on-surface-variant font-label-sm text-label-sm mt-1">Order #SF12345678</p>
</div>
<div class="bg-primary-container/20 p-3 rounded-full">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">timer</span>
</div>
</div>
</div>
</div>
</div>
<!-- Details Sheet Area -->
<div class="bg-surface rounded-t-3xl -mt-8 relative z-20 shadow-[0px_-8px_30px_rgba(0,0,0,0.08)] px-gutter pt-8 pb-10">
<!-- Progress Stepper -->
<div class="mb-10">
<div class="flex items-center gap-4 mb-2">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">local_shipping</span>
</div>
<div>
<h3 class="font-headline-md text-headline-md text-on-background">Your order is on the way 🚀</h3>
<p class="text-secondary font-body-md text-body-md">Your rider is heading to you.</p>
</div>
</div>
<!-- Custom Progress Bar -->
<div class="mt-6 flex gap-2">
<div class="h-1.5 flex-1 bg-primary rounded-full"></div>
<div class="h-1.5 flex-1 bg-primary rounded-full overflow-hidden relative">
<div class="absolute inset-0 bg-white/40 animate-pulse"></div>
</div>
<div class="h-1.5 flex-1 bg-surface-container-high rounded-full"></div>
</div>
</div>
<!-- Rider Profile -->
<div class="bg-surface-container-low rounded-2xl p-4 flex items-center justify-between border border-surface-variant">
<div class="flex items-center gap-4">
<div class="w-14 h-14 rounded-full overflow-hidden border-2 border-white shadow-sm">
<img class="w-full h-full object-cover" data-alt="Close up professional headshot of a friendly delivery rider wearing a branded StoreFlow polo shirt and a cap. The background is a clean urban street with warm, natural afternoon lighting. The person has a kind smile, looking directly at the camera with professional confidence. High quality photography with soft depth of field." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB-oXCg5Wyubo25JdeFL_-HwxnzRqtlU1UC3T32c925UCrP_lGt3Cxx0dlZF0d2gkAxQZIRdstz5-0H5KYcE08QnbHZP2yUqDGKF6gC1ABCxtVySzcJUHh8f9QKCuU12cPWqVM3JnpBKJPQ7lm0hc-apxYotLkWL-1RM7_nC1-VxqHoTgVjksios2EfCuDU4pGG3YqX_9-XwfceNNehPH1sG1RO1Va50gKe5TBMLxBTNAk4x2dKJMmSyg"/>
</div>
<div>
<p class="text-secondary text-label-sm font-label-sm mb-0.5">Rider</p>
<h4 class="font-headline-md text-on-background">Tunde A.</h4>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-primary-container text-lg" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="font-bold text-on-surface">4.8</span>
</div>
</div>
</div>
<div class="flex gap-3">
<button class="w-12 h-12 bg-white rounded-xl shadow-sm border border-surface-variant flex items-center justify-center hover:bg-primary-container transition-colors duration-200">
<span class="material-symbols-outlined text-on-surface">chat_bubble</span>
</button>
<button class="flex items-center gap-2 px-5 py-3 bg-on-background text-white rounded-xl font-label-lg hover:opacity-90 active:scale-95 transition-all">
<span class="material-symbols-outlined text-xl">call</span>
<span>Call</span>
</button>
</div>
</div>
<!-- Action Area -->
<div class="mt-8">
<button class="w-full h-14 bg-surface-container-highest text-on-surface font-headline-md rounded-xl hover:bg-surface-variant transition-colors flex items-center justify-center gap-2">
                    View Order Details
                    <span class="material-symbols-outlined">expand_more</span>
</button>
</div>
</div>
</main>
<!-- Navigation Shell (Using Shared Components Logic) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-3 bg-surface dark:bg-background shadow-[0px_-4px_20px_rgba(0,0,0,0.05)] rounded-t-xl md:hidden">
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container-lowest transition-all" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-label-sm text-label-sm">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container-lowest transition-all" href="#">
<span class="material-symbols-outlined">grid_view</span>
<span class="font-label-sm text-label-sm">Categories</span>
</a>
<a class="flex flex-col items-center justify-center text-primary dark:text-primary-fixed relative after:content-[''] after:absolute after:-bottom-1 after:w-1 after:h-1 after:bg-primary-container after:rounded-full transition-all scale-90" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">receipt_long</span>
<span class="font-label-sm text-label-sm">Orders</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container-lowest transition-all" href="#">
<span class="material-symbols-outlined">shopping_cart</span>
<span class="font-label-sm text-label-sm">Cart</span>
</a>
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim hover:bg-surface-container-lowest transition-all" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm">Profile</span>
</a>
</nav>
<script>
        // Simple Micro-interaction: Smooth floating animation for the rider marker
        const riderMarker = document.getElementById('rider-marker');
        let floatY = 0;
        let direction = 1;

        function animateRider() {
            floatY += 0.05 * direction;
            if (Math.abs(floatY) > 5) direction *= -1;
            
            // Subtle movement simulated over time
            riderMarker.style.transform = `translate(${floatY * 2}px, ${floatY}px)`;
            requestAnimationFrame(animateRider);
        }
        
        animateRider();

        // Active State Scaling Logic simulation
        document.querySelectorAll('nav a').forEach(link => {
            link.addEventListener('click', function(e) {
                document.querySelectorAll('nav a').forEach(l => {
                    l.classList.remove('text-primary', 'after:content-[""]', 'after:absolute', 'after:-bottom-1', 'after:w-1', 'after:h-1', 'after:bg-primary-container', 'after:rounded-full', 'scale-90');
                    l.classList.add('text-secondary');
                });
                this.classList.remove('text-secondary');
                this.classList.add('text-primary', 'after:content-[""]', 'after:absolute', 'after:-bottom-1', 'after:w-1', 'after:h-1', 'after:bg-primary-container', 'after:rounded-full', 'scale-90');
            });
        });
    </script>
</body></html>
