<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StoreFlow - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
      -webkit-tap-highlight-color: transparent;
      scroll-behavior: smooth;
    }
    .login-gradient {
      background: radial-gradient(circle at top right, rgba(255, 214, 0, 0.05), transparent 40%),
                  radial-gradient(circle at bottom left, rgba(27, 28, 28, 0.03), transparent 40%);
    }
  </style>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
                  "surface-variant": "#e3e2e2",
                  "surface-container-low": "#f5f3f3",
                  "surface-container-highest": "#e3e2e2",
                  "surface-container-high": "#e9e8e7",
                  "tertiary-fixed-dim": "#c6c6c7",
                  "on-background": "#1b1c1c",
                  "tertiary-container": "#d9d9d9",
                  "outline": "#7f775f",
                  "on-secondary-fixed": "#1c1b1b",
                  "on-error": "#ffffff",
                  "secondary-fixed": "#e5e2e1",
                  "outline-variant": "#d0c6ab",
                  "error": "#ba1a1a",
                  "on-secondary-fixed-variant": "#474646",
                  "on-tertiary-container": "#5d5f5f",
                  "surface-tint": "#705d00",
                  "tertiary": "#5d5f5f",
                  "surface-container": "#efeded",
                  "on-secondary-container": "#656464",
                  "primary-fixed-dim": "#e9c400",
                  "on-primary-fixed": "#221b00",
                  "on-primary-fixed-variant": "#544600",
                  "inverse-primary": "#e9c400",
                  "surface": "#fbf9f9",
                  "on-tertiary-fixed": "#1a1c1c",
                  "primary-container": "#ffd600",
                  "on-error-container": "#93000a",
                  "surface-dim": "#dbdad9",
                  "secondary": "#5f5e5e",
                  "surface-container-lowest": "#ffffff",
                  "secondary-fixed-dim": "#c8c6c5",
                  "secondary-container": "#e5e2e1",
                  "on-surface": "#1b1c1c",
                  "primary-fixed": "#ffe170",
                  "on-primary": "#ffffff",
                  "primary": "#705d00",
                  "surface-bright": "#fbf9f9",
                  "error-container": "#ffdad6",
                  "tertiary-fixed": "#e2e2e2",
                  "background": "#fbf9f9",
                  "on-tertiary-fixed-variant": "#454747",
                  "on-surface-variant": "#4d4632",
                  "on-tertiary": "#ffffff",
                  "inverse-surface": "#303031",
                  "on-secondary": "#ffffff",
                  "on-primary-container": "#705d00",
                  "inverse-on-surface": "#f2f0f0"
          },
          "borderRadius": {
                  "DEFAULT": "0.25rem",
                  "lg": "0.5rem",
                  "xl": "0.75rem",
                  "full": "9999px"
          },
          "spacing": {
                  "base": "8px",
                  "stack-lg": "32px",
                  "stack-sm": "8px",
                  "gutter": "16px",
                  "container-padding": "24px",
                  "stack-md": "16px"
          },
          "fontFamily": {
                  "headline-lg": ["Plus Jakarta Sans"],
                  "label-sm": ["Inter"],
                  "body-md": ["Inter"],
                  "headline-xl": ["Plus Jakarta Sans"],
                  "headline-xl-mobile": ["Plus Jakarta Sans"],
                  "body-lg": ["Inter"],
                  "headline-md": ["Plus Jakarta Sans"],
                  "label-lg": ["Inter"]
          },
          "fontSize": {
                  "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                  "label-sm": ["12px", {"lineHeight": "14px", "fontWeight": "500"}],
                  "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                  "headline-xl": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                  "headline-xl-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                  "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                  "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                  "label-lg": ["14px", {"lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "600"}]
          }
        },
      },
    }
  </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md text-body-md overflow-x-hidden min-h-screen login-gradient">
<!-- Top Bar (Minimal/Back) -->
<header class="flex justify-between items-center w-full px-gutter h-14 fixed top-0 left-0 z-50 bg-surface/80 backdrop-blur-md">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-all active:scale-95">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
</header>
<main class="pt-24 pb-12 px-container-padding flex flex-col max-w-md mx-auto min-h-screen justify-center">
<!-- Branding/Greeting -->
<div class="mb-10 text-center md:text-left">
<h1 class="font-headline-xl-mobile text-headline-xl-mobile md:font-headline-xl md:text-headline-xl text-on-background mb-2">
        Welcome back 👋
      </h1>
<p class="text-secondary font-body-lg text-body-lg">
        Log in to continue
      </p>
</div>
<!-- Login Form -->
<form class="space-y-stack-lg" onsubmit="return false;">
<!-- Phone Field -->
<div class="group">
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-2 px-1" for="phone">
          Phone number
        </label>
<div class="relative flex items-center bg-surface-container-low rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-on-background transition-all duration-200 h-[56px]">
<div class="pl-4 pr-3 border-r border-outline-variant/30 flex items-center gap-1">
<span class="font-label-lg text-label-lg text-on-surface">+234</span>
<span class="material-symbols-outlined text-on-surface-variant text-[18px]">keyboard_arrow_down</span>
</div>
<input class="w-full bg-transparent border-none focus:ring-0 px-4 py-3 text-on-background font-body-lg text-body-lg placeholder:text-secondary/50" id="phone" placeholder="801 234 5678" type="tel"/>
</div>
</div>
<!-- Password Field -->
<div class="group">
<label class="block font-label-lg text-label-lg text-on-surface-variant mb-2 px-1" for="password">
          Password
        </label>
<div class="relative flex items-center bg-surface-container-low rounded-xl overflow-hidden focus-within:ring-2 focus-within:ring-on-background transition-all duration-200 h-[56px]">
<input class="w-full bg-transparent border-none focus:ring-0 px-4 py-3 text-on-background font-body-lg text-body-lg placeholder:text-secondary/50" id="password" placeholder="••••••••••••" type="password"/>
<button class="px-4 text-on-surface-variant hover:text-on-surface" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" id="password-toggle">visibility_off</span>
</button>
</div>
<div class="flex justify-end mt-3">
<a class="font-label-lg text-label-lg text-secondary hover:text-primary transition-colors" href="#">
            Forgot password?
          </a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-14 bg-on-background text-surface font-headline-md text-headline-md rounded-xl transition-all duration-200 active:scale-95 shadow-sm hover:shadow-md">
        Log In
      </button>
<!-- Divider -->
<div class="relative flex items-center py-4">
<div class="flex-grow border-t border-surface-variant"></div>
<span class="flex-shrink mx-4 text-secondary font-label-sm text-label-sm">or continue with</span>
<div class="flex-grow border-t border-surface-variant"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 h-14 border border-surface-variant rounded-xl bg-surface hover:bg-surface-container-lowest transition-all active:scale-95 group">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
<span class="font-label-lg text-label-lg text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center gap-2 h-14 border border-surface-variant rounded-xl bg-surface hover:bg-surface-container-lowest transition-all active:scale-95 group">
<svg class="w-5 h-5 fill-on-background" viewbox="0 0 24 24">
<path d="M17.05 20.28c-.96.95-2.04 1.72-3.37 1.72-1.28 0-1.68-.78-3.23-.78-1.57 0-2.02.76-3.23.78-1.29.02-2.31-.76-3.29-1.74-2.01-1.99-3.53-5.63-1.48-9.17 1.02-1.76 2.83-2.87 4.79-2.9 1.49-.03 2.89 1 3.79 1 .89 0 2.62-1.24 4.39-1.05 1.83.2 3.24 1.14 4.09 2.45-1.79 1.08-1.51 3.39.26 4.29 1.19.61 2.48 1.45 2.48 3.36 0 .47-.07.96-.23 1.46-.1.35-.33.72-.47.88M12.03 7.25c-.02-2.14 1.77-3.88 3.8-3.92.03 2.01-1.8 3.84-3.8 3.92M15.42 1.34c.03 0 .05.01.08.01.1-.92-.26-1.85-.92-2.52C13.84-1.92 12.82-2.3 11.83-2.3c-.03 0-.05.01-.08.01-.1.95.31 1.9 1 2.58.74.74 1.8 1.1 2.67 1.05z" transform="translate(2 2)"></path>
</svg>
<span class="font-label-lg text-label-lg text-on-surface">Apple</span>
</button>
</div>
</form>
<!-- Footer Links -->
<div class="mt-auto pt-10 text-center">
<p class="text-secondary font-body-md text-body-md">
        Don't have an account? 
        <a class="text-on-background font-label-lg text-label-lg hover:underline underline-offset-4 decoration-primary-container decoration-2 transition-all" href="#">Sign up</a>
</p>
</div>
</main>
<!-- Decoration elements for "Less is More" luxury feel -->
<div class="fixed top-[15%] -right-12 w-64 h-64 bg-primary-container/10 blur-[100px] rounded-full -z-10 pointer-events-none"></div>
<div class="fixed bottom-[10%] -left-12 w-80 h-80 bg-on-background/5 blur-[120px] rounded-full -z-10 pointer-events-none"></div>
<script>
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.getElementById('password-toggle');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.innerText = 'visibility';
      } else {
        passwordInput.type = 'password';
        toggleIcon.innerText = 'visibility_off';
      }
    }

    // Interaction feedback for the phone input group
    const phoneInput = document.getElementById('phone');
    const phoneContainer = phoneInput.closest('.relative');
    
    phoneInput.addEventListener('focus', () => {
      phoneContainer.classList.add('shadow-md');
    });
    
    phoneInput.addEventListener('blur', () => {
      phoneContainer.classList.remove('shadow-md');
    });
  </script>
</body></html>
