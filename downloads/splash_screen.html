<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      line-height: 1;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
    }

    /* Custom Fade-In Animation for Splash */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up {
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    .stagger-1 { animation-delay: 0.1s; }
    .stagger-2 { animation-delay: 0.2s; }
    .stagger-3 { animation-delay: 0.3s; }

    /* Glassmorphism subtle effect */
    .glass-dark {
      background: rgba(27, 28, 28, 0.85);
      backdrop-filter: blur(8px);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-on-background text-surface selection:bg-primary selection:text-on-background min-h-screen flex flex-col items-center justify-center overflow-hidden">
<!-- Splash Screen Container -->
<main class="relative w-full max-w-[430px] h-[932px] bg-on-background flex flex-col justify-between items-center py-20 px-10 overflow-hidden shadow-2xl">
<!-- Background Atmospheric Effect -->
<div class="absolute inset-0 pointer-events-none opacity-20">

</div>
<!-- Center Content (Logo & Brand) -->

<!-- Logo Container -->
<div class="animate-fade-up stagger-1 mb-6 flex items-center justify-center w-24 h-24 bg-surface rounded-[28%] rotate-12 shadow-xl">
<span class="material-symbols-outlined text-[64px] text-on-background -rotate-12" style="font-variation-settings: 'FILL' 1;">
          inventory_2
        </span>
</div>
<!-- Brand Name -->
<h1 class="animate-fade-up stagger-2 font-headline-xl-mobile text-headline-xl-mobile text-surface tracking-tight">
        StoreFlow
      </h1>
<!-- Tagline -->
<p class="animate-fade-up stagger-3 mt-3 font-body-lg text-body-lg text-surface-variant max-w-[200px] leading-relaxed">
        Everything you need, delivered fast.
      </p>
</div>
<!-- Bottom Illustrations/Icons -->
<div class="animate-fade-up stagger-3 flex flex-col items-center gap-12 w-full z-10">
<!-- Icon Row -->
<div class="flex justify-center gap-10 opacity-40">
<div class="flex flex-col items-center gap-2">
<span class="material-symbols-outlined text-surface text-[28px]">storefront</span>
</div>
<div class="flex flex-col items-center gap-2">
<span class="material-symbols-outlined text-surface text-[28px]">delivery_dining</span>
</div>
<div class="flex flex-col items-center gap-2">
<span class="material-symbols-outlined text-surface text-[28px]">qr_code_2</span>
</div>
</div>
<!-- Interactive Progress Loader (Simulated) -->
<div class="w-full max-w-[140px] h-1 bg-surface-variant/20 rounded-full overflow-hidden">
<div class="h-full bg-primary-container w-0 transition-all duration-3000 ease-out" id="loader"></div>
</div>
</div>
</main>
<!-- Script for Splash Micro-interaction -->
<script>
    window.addEventListener('DOMContentLoaded', () => {
      const loader = document.getElementById('loader');
      setTimeout(() => {
        loader.style.width = '100%';
      }, 500);

      // Simple click-to-proceed simulation for the demo environment
      document.body.addEventListener('click', () => {
        console.log('Navigating to Onboarding...');
        // In a real app, this would trigger navigation
      });

      // Subtle parallax on mouse move
      document.addEventListener('mousemove', (e) => {
        const moveX = (e.clientX - window.innerWidth / 2) / 50;
        const moveY = (e.clientY - window.innerHeight / 2) / 50;
        const logo = document.querySelector('.animate-fade-up.stagger-1');
        if (logo) {
          logo.style.transform = `translate(${moveX}px, ${moveY}px) rotate(12deg)`;
        }
      });
    });
  </script>
<!-- Content for Screen Reader/SEO -->
<div class="sr-only">
<h2>StoreFlow</h2>
