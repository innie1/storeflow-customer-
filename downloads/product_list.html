<script>
        function quickAdd(btn) {
            // Simple visual feedback for "Add" action
            const icon = btn.querySelector('.material-symbols-outlined');
            const originalIcon = icon.innerText;
            
            icon.innerText = 'check';
            btn.classList.replace('bg-primary-container', 'bg-on-background');
            btn.classList.replace('text-on-primary-container', 'text-surface');
            
            setTimeout(() => {
                icon.innerText = originalIcon;
                btn.classList.replace('bg-on-background', 'bg-primary-container');
                btn.classList.replace('text-surface', 'text-on-primary-container');
            }, 1000);
            
            // Interaction vibration/feedback simulation
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(50);
            }
        }

        // Horizontal scroll animation logic for chips if needed
        const chipContainer = document.querySelector('.overflow-x-auto');
        let isDown = false;
        let startX;
        let scrollLeft;

        chipContainer.addEventListener('mousedown', (e) => {
            isDown = true;
            startX = e.pageX - chipContainer.offsetLeft;
            scrollLeft = chipContainer.scrollLeft;
        });
        chipContainer.addEventListener('mouseleave', () => {
            isDown = false;
        });
        chipContainer.addEventListener('mouseup', () => {
            isDown = false;
        });
        chipContainer.addEventListener('mousemove', (e) => {
            if (!isDown) return;
            e.preventDefault();
            const x = e.pageX - chipContainer.offsetLeft;
            const walk = (x - startX) * 2;
            chipContainer.scrollLeft = scrollLeft - walk;
        });
    </script>
