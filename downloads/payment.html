<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StoreFlow - Secure Payment</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-variant": "#e3e2e2",
                        "surface-container-low": "#f5f3f3",
                        "surface-container-highest": "#e3e2e2",
                        "surface-container-high": "#e9e8e7",
                        "tertiary-fixed-dim": "#c6c6c7",
                        "on-background": "#1b1c1c",
                        "tertiary-container": "#d9d9d9",
                        "outline": "#7f775f",
                        "on-secondary-fixed": "#1c1b1b",
                        "on-error": "#ffffff",
                        "secondary-fixed": "#e5e2e1",
                        "outline-variant": "#d0c6ab",
                        "error": "#ba1a1a",
                        "on-secondary-fixed-variant": "#474646",
                        "on-tertiary-container": "#5d5f5f",
                        "surface-tint": "#705d00",
                        "tertiary": "#5d5f5f",
                        "surface-container": "#efeded",
                        "on-secondary-container": "#656464",
                        "primary-fixed-dim": "#e9c400",
                        "on-primary-fixed": "#221b00",
                        "on-primary-fixed-variant": "#544600",
                        "inverse-primary": "#e9c400",
                        "surface": "#fbf9f9",
                        "on-tertiary-fixed": "#1a1c1c",
                        "primary-container": "#ffd600",
                        "on-error-container": "#93000a",
                        "surface-dim": "#dbdad9",
                        "secondary": "#5f5e5e",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#c8c6c5",
                        "secondary-container": "#e5e2e1",
                        "on-surface": "#1b1c1c",
                        "primary-fixed": "#ffe170",
                        "on-primary": "#ffffff",
                        "primary": "#705d00",
                        "surface-bright": "#fbf9f9",
                        "error-container": "#ffdad6",
                        "tertiary-fixed": "#e2e2e2",
                        "background": "#fbf9f9",
                        "on-tertiary-fixed-variant": "#454747",
                        "on-surface-variant": "#4d4632",
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#303031",
                        "on-secondary": "#ffffff",
                        "on-primary-container": "#705d00",
                        "inverse-on-surface": "#f2f0f0"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "stack-lg": "32px",
                        "stack-sm": "8px",
                        "gutter": "16px",
                        "container-padding": "24px",
                        "stack-md": "16px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Plus Jakarta Sans"],
                        "label-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-xl": ["Plus Jakarta Sans"],
                        "headline-xl-mobile": ["Plus Jakarta Sans"],
                        "body-lg": ["Inter"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "label-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "label-sm": ["12px", {"lineHeight": "14px", "fontWeight": "500"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "headline-xl": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-xl-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "label-lg": ["14px", {"lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .payment-method-selected {
            border: 2px solid #1b1c1c;
            background-color: #ffffff;
        }
        .payment-method-unselected {
            border: 2px solid transparent;
            background-color: #f5f3f3;
        }
        body {
            background-color: #fbf9f9;
            color: #1b1c1c;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-md text-body-md antialiased overflow-x-hidden">
<!-- Top App Bar -->
<header class="fixed top-0 left-0 w-full z-50 bg-surface dark:bg-background flex justify-between items-center px-gutter h-14">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-low dark:hover:bg-surface-variant transition-transform active:scale-95 duration-150">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile text-on-background dark:text-on-surface">Payment</h1>
</div>
<div class="flex items-center">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-low dark:hover:bg-surface-variant transition-transform active:scale-95 duration-150">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed">help_outline</span>
</button>
</div>
</header>
<main class="pt-20 pb-32 px-container-padding max-w-md mx-auto">
<!-- Progress Steps -->
<div class="flex justify-between items-center mb-stack-lg">
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-on-background flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[18px]" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-label-sm text-label-sm text-on-background">Delivery</span>
</div>
<div class="h-[2px] flex-1 bg-on-background mx-2 -mt-6"></div>
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-on-background flex items-center justify-center">
<span class="material-symbols-outlined text-white text-[18px]">payments</span>
</div>
<span class="font-label-sm text-label-sm text-on-background font-bold">Payment</span>
</div>
<div class="h-[2px] flex-1 bg-surface-variant mx-2 -mt-6"></div>
<div class="flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-secondary text-[18px]">rate_review</span>
</div>
<span class="font-label-sm text-label-sm text-secondary">Review</span>
</div>
</div>
<!-- Section Title -->
<h2 class="font-headline-md text-headline-md-mobile mb-stack-md">Select Payment Method</h2>
<!-- Payment Options List -->
<div class="space-y-4">
<!-- Option: Debit Card -->
<label class="block relative cursor-pointer" onclick="selectPayment(this)">
<input checked="" class="hidden" name="payment_method" type="radio"/>
<div class="payment-method-selected p-5 rounded-xl transition-all duration-200 flex items-center justify-between shadow-sm">
<div class="flex items-center gap-4">
<div class="w-12 h-12 bg-white rounded-lg flex items-center justify-center border border-surface-container-high">
<span class="material-symbols-outlined text-on-background" style="font-variation-settings: 'FILL' 1;">credit_card</span>
</div>
<div>
<p class="font-label-lg text-label-lg text-on-background">Debit Card</p>
<div class="flex items-center gap-2 mt-1">
<div class="w-6 h-4 bg-surface-variant rounded-sm flex items-center justify-center text-[8px] font-bold">VISA</div>
<div class="w-6 h-4 bg-on-background rounded-sm flex items-center justify-center text-[8px] font-bold text-white">Verve</div>
</div>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-on-background flex items-center justify-center">
<div class="w-3 h-3 rounded-full bg-on-background"></div>
</div>
</div>
</label>
<!-- Option: Bank Transfer -->
<label class="block relative cursor-pointer" onclick="selectPayment(this)">
<input class="hidden" name="payment_method" type="radio"/>
<div class="payment-method-unselected p-5 rounded-xl transition-all duration-200 flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-12 h-12 bg-white rounded-lg flex items-center justify-center border border-surface-container-high">
<span class="material-symbols-outlined text-secondary">account_balance</span>
</div>
<div>
<p class="font-label-lg text-label-lg text-on-background">Bank Transfer</p>
<p class="font-label-sm text-label-sm text-secondary mt-1">Pay via Mobile App</p>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-surface-variant"></div>
</div>
</label>
<!-- Option: Wallet -->
<label class="block relative cursor-pointer" onclick="selectPayment(this)">
<input class="hidden" name="payment_method" type="radio"/>
<div class="payment-method-unselected p-5 rounded-xl transition-all duration-200 flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-12 h-12 bg-white rounded-lg flex items-center justify-center border border-surface-container-high">
<span class="material-symbols-outlined text-secondary">account_balance_wallet</span>
</div>
<div>
<div class="flex items-center gap-2">
<p class="font-label-lg text-label-lg text-on-background">StoreFlow Wallet</p>
<span class="px-2 py-0.5 bg-primary-container text-on-primary-container text-[10px] font-bold rounded-full">RECOMMENDED</span>
</div>
<p class="font-label-sm text-label-sm text-primary font-semibold mt-1">Balance: ₦2,450</p>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-surface-variant"></div>
</div>
</label>
<!-- Option: Cash on Delivery -->
<label class="block relative cursor-pointer" onclick="selectPayment(this)">
<input class="hidden" name="payment_method" type="radio"/>
<div class="payment-method-unselected p-5 rounded-xl transition-all duration-200 flex items-center justify-between">
<div class="flex items-center gap-4">
<div class="w-12 h-12 bg-white rounded-lg flex items-center justify-center border border-surface-container-high">
<span class="material-symbols-outlined text-secondary">payments</span>
</div>
<div>
<p class="font-label-lg text-label-lg text-on-background">Cash on Delivery</p>
<p class="font-label-sm text-label-sm text-secondary mt-1">Pay when you receive</p>
</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-surface-variant"></div>
</div>
</label>
</div>
<!-- Security Badge -->
<div class="mt-stack-lg flex items-center justify-center gap-2 py-4 bg-surface-container-low rounded-xl border border-surface-container-high">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">verified_user</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Your transaction is secured with SSL encryption</span>
</div>
</main>
<!-- Bottom Action Bar -->
<footer class="fixed bottom-0 left-0 w-full p-container-padding bg-surface/80 backdrop-blur-md z-50">
<div class="max-w-md mx-auto">
<div class="flex justify-between items-center mb-4">
<span class="text-secondary font-label-lg">Total to Pay</span>
<span class="text-on-background font-headline-md">₦2,160</span>
</div>
<button class="w-full bg-on-background text-white h-14 rounded-xl font-headline-md flex items-center justify-center gap-2 hover:opacity-90 active:scale-95 transition-all duration-150">
<span>Continue to Review</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</footer>
<!-- Interactive Logic -->
<script>
        function selectPayment(element) {
            // Reset all labels
            const labels = document.querySelectorAll('label');
            labels.forEach(label => {
                const container = label.querySelector('div');
                const radioMarkContainer = container.querySelector('div:last-child');
                
                container.classList.remove('payment-method-selected', 'shadow-sm');
                container.classList.add('payment-method-unselected');
                
                radioMarkContainer.classList.remove('border-on-background');
                radioMarkContainer.classList.add('border-surface-variant');
                radioMarkContainer.innerHTML = '';
            });

            // Set current
            const container = element.querySelector('div');
            const radioMarkContainer = container.querySelector('div:last-child');
            
            container.classList.remove('payment-method-unselected');
            container.classList.add('payment-method-selected', 'shadow-sm');
            
            radioMarkContainer.classList.remove('border-surface-variant');
            radioMarkContainer.classList.add('border-on-background');
            radioMarkContainer.innerHTML = '<div class="w-3 h-3 rounded-full bg-on-background"></div>';
        }

        // Apply dark mode check (not implemented via toggle here but following system)
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            // document.documentElement.classList.add('dark');
        }
    </script>
</body></html>
